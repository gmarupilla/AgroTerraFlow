# TerraFlow demo configuration — western Kansas, USDA CDL 2025
#
# Demo raster (data/usda_cdl.tif) is not stored in git.
# To obtain it, run:
#   make get-demo-data          # synthetic CDL-compatible raster (offline)
#
# Or download the real USDA CDL 2025 from CropScape:
#   https://nassgeodata.gmu.edu/CropScape/
#   → Download Data → CDL tab → Year 2025 → bbox below → Submit
#
# Data source: USDA NASS Cropland Data Layer (public domain, 17 U.S.C. § 105)

raster_path: "../data/usda_cdl.tif"
climate_csv: "../data/demo_climate.csv"
output_dir: "../outputs/demo_run"

roi:
  type: "bbox"
  xmin: -101   # West  (longitude, WGS84)
  ymin: 38     # South (latitude,  WGS84)
  xmax: -94    # East  (longitude, WGS84)
  ymax: 40     # North (latitude,  WGS84)

max_cells: 2000

model_params:
  v_min: 0
  v_max: 255
  t_min: 0
  t_max: 40
  r_min: 0
  r_max: 300
  w_v: 0.4
  w_t: 0.3
  w_r: 0.3
  uncertainty_samples: 200

# Spatial interpolation — kriging exposes per-cell prediction standard
# deviations that feed the Monte-Carlo confidence intervals above.
climate:
  strategy: spatial
  interpolation_method: kriging
  variogram_mode: standard   # set "extended" to also evaluate nested variograms (slower)
  fallback_to_mean: true

# Sensitivity analysis configuration (Phase 2)
# Run with: terraflow sensitivity -c examples/demo_config.yml
sensitivity:
  w_v:
    low: 0.2
    high: 0.5
  w_t:
    low: 0.2
    high: 0.5
  w_r:
    low: 0.1
    high: 0.4
  n_samples: 1024
  method: both  # sobol | morris | both

# Model validation configuration (Phase 3)
# Run with: terraflow validate -c examples/demo_config.yml
validation:
  n_blocks_side: 4
  buffer_deg: 0.5
