[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraflow-agro"
version = "0.2.1"
description = "TerraFlow: a reproducible workflow for geospatial agricultural modeling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Gnaneswara (Akhil) Marupilla" }
]

keywords = ["geospatial", "agriculture", "raster", "climate", "workflow"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pyarrow>=14.0",
  "rasterio>=1.2.0",
  "pyyaml>=5.4.0",
  "pydantic>=2.0",
  "scipy>=1.9.0",
  "pykrige>=1.7",
  "shapely>=2.0.0",
  "pyproj>=3.0"
]

[project.optional-dependencies]
viz = ["plotly>=5.0.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=3.0",
  "mypy>=1.10",
  "pip-licenses>=4.3",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "ruff",
  "black",
  "build",
  "marimo>=0.19",
  "matplotlib>=3.7",
  "seaborn>=0.13"
]

[project.scripts]
terraflow = "terraflow.cli:main"

[project.urls]
Homepage = "https://github.com/gmarupilla/AgroTerraFlow"
"Bug Tracker" = "https://github.com/gmarupilla/AgroTerraFlow/issues"
Documentation = "https://gmarupilla.github.io/AgroTerraFlow/"

[tool.setuptools]
packages = ["terraflow", "terraflow.core"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["terraflow", "tests"]

[tool.ruff]
exclude = ["docs/", "notebooks/", "scripts/", "*.ipynb"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end smoke tests using synthetic data (run with: pytest -m smoke)",
]

[tool.coverage.run]
branch = true
source = ["terraflow"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
