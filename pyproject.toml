[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraflow-agro"
version = "0.2.0"
description = "TerraFlow: a reproducible workflow for geospatial agricultural modeling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Gnaneswara (Akhil) Marupilla" }
]

keywords = ["geospatial", "agriculture", "raster", "climate", "workflow"]

dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "rasterio>=1.2.0",
  "pyyaml>=5.4.0",
  "plotly>=5.0.0",
  "pydantic>=2.0",
  "scipy>=1.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=3.0",
  "ruff",
  "black",
  "marimo>=0.19",
  "matplotlib>=3.7",
  "seaborn>=0.13"
]

[project.urls]
Homepage = "https://github.com/gmarupilla/AgroTerraFlow"
"Bug Tracker" = "https://github.com/gmarupilla/AgroTerraFlow/issues"

[tool.setuptools]
packages = ["terraflow"]
