site_name: TerraFlow
site_description: Reproducible geospatial modeling with spatial climate interpolation (v0.2.0)
repo_url: https://github.com/gmarupilla/AgroTerraFlow

theme:
  name: material
  favicon: favicon.svg
  logo: terraflow-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: true

nav:
  - Home: index.md
  - TerraFlow in 10 Minutes: quickstart.md
  - Field Guide: field-guide.md
  - Architecture:
      - TerraFlow Overview: architecture/overview.md
      - ADR-001 Band Selection: architecture/adr-001-band-selection.md
      - ADR-002 BBox ROI: architecture/adr-002-bbox-roi.md
      - ADR-003 Climate Interpolation: architecture/adr-003-climate-interpolation.md
      - ADR-004 CRS Reprojection: architecture/adr-004-crs-reprojection.md
      - Boundaries: architecture/boundaries.md
      - Run Identity: architecture/run-identity.md
      - Artifact Contract: architecture/artifacts.md
  - Config:
      - Schema: config/schema.md
      - Examples: config/examples.md
  - CLI:
      - Usage: cli/usage.md
  - API Reference:
      - terraflow.core: api/core.md
      - terraflow.ingest: api/ingest.md
      - terraflow.climate: api/climate.md
  - Notebooks:
      - TerraFlow v0.2.0 (Marimo): notebooks/terraflow_v0_2_0_comprehensive_test.md
  - Development: DEVELOPMENT.md
  - Roadmap: ROADMAP.md
  - Contributing: contributing.md
