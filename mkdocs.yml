site_name: TerraFlow
site_description: Reproducible climate-impact assessment of agricultural suitability — config-driven, fingerprinted, uncertainty-aware.
site_url: https://terraflow.marupilla.dev/
repo_url: https://github.com/gmarupilla/AgroTerraFlow
repo_name: gmarupilla/AgroTerraFlow
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 TerraFlow Contributors

theme:
  name: material
  favicon: favicon.svg
  logo: terraflow-icon.svg

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.breadcrumbs
    # TOC
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gmarupilla/AgroTerraFlow
      name: TerraFlow on GitHub
  version:
    provider: mike
    default: stable

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  # Standard extensions
  - attr_list
  - md_in_html
  - def_list
  - tables
  - abbr
  - admonition
  - footnotes
  # PyMdown extensions
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - toc:
      permalink: true
      title: On this page

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: numpy
            merge_init_into_class: true

nav:
  - Home: index.md
  - TerraFlow in 10 Minutes: quickstart.md
  - Field Guide: field-guide.md
  - Reproducibility: reproducibility.md
  - Architecture:
      - TerraFlow Overview: architecture/overview.md
      - ADR-001 Band Selection: architecture/adr-001-band-selection.md
      - ADR-002 BBox ROI: architecture/adr-002-bbox-roi.md
      - ADR-003 Climate Interpolation: architecture/adr-003-climate-interpolation.md
      - ADR-004 CRS Reprojection: architecture/adr-004-crs-reprojection.md
      - ADR-005 Kriging Interpolation: architecture/adr-005-kriging-interpolation.md
      - ADR-006 Homebrew Distribution: architecture/adr-006-homebrew-distribution.md
      - Boundaries: architecture/boundaries.md
      - Run Identity: architecture/run-identity.md
      - Artifact Contract: architecture/artifacts.md
  - Config:
      - Schema: config/schema.md
      - Examples: config/examples.md
  - CLI:
      - Usage: cli/usage.md
  - Install:
      - Homebrew (macOS): install/homebrew.md
  - API Reference:
      - terraflow.core: api/core.md
      - terraflow.ingest: api/ingest.md
      - terraflow.geo: api/geo.md
      - terraflow.climate: api/climate.md
      - terraflow.model: api/model.md
      - terraflow.stats: api/stats.md
      - terraflow.sensitivity: api/sensitivity.md
      - terraflow.validation: api/validation.md
  - Notebooks:
      - TerraFlow v0.2.0 Demo: notebooks/terraflow_v0_2_0_comprehensive_test.ipynb
      - Kriging and Uncertainty: notebooks/kriging_uncertainty_demo.ipynb
      - Extended Variogram Mode: notebooks/05_extended_variogram_mode.ipynb
      - Sensitivity Analysis: notebooks/02_sensitivity_analysis.ipynb
      - Model Validation: notebooks/03_model_validation.ipynb
  - Development: DEVELOPMENT.md
  - Roadmap: ROADMAP.md
  - Contributing: contributing.md
