name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: make venv

      - name: Build site
        run: make docs-build

      - name: Deploy to gh-pages (preserve pr-* preview dirs)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          # Save any existing pr-* preview subdirectories.
          mkdir -p /tmp/pr-previews
          for d in /tmp/gh-pages/pr-*/; do
            [ -d "$d" ] && cp -r "$d" /tmp/pr-previews/
          done

          # Replace everything except .git, CNAME, .nojekyll, and pr-* dirs.
          find /tmp/gh-pages -maxdepth 1 \
            -not -name '.'         \
            -not -name '.git'      \
            -not -name '.nojekyll' \
            -not -name 'CNAME'     \
            -not -name 'pr-*'      \
            | xargs rm -rf

          cp -r site/. /tmp/gh-pages/

          # Restore PR preview subdirectories.
          for d in /tmp/pr-previews/*/; do
            [ -d "$d" ] && cp -r "$d" /tmp/gh-pages/
          done

          cd /tmp/gh-pages
          git add -A
          git diff --cached --quiet && echo "No changes to deploy." && exit 0
          git commit -m "docs: deploy from ${GITHUB_SHA::8}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:gh-pages
