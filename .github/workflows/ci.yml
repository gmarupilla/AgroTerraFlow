name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Ensure make is available
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Set up virtualenv and install dev deps
        run: |
          make venv
          make dev

      - name: Run tests with coverage
        run: |
          make test-cov

      - name: Run linting
        run: |
          make lint

      - name: Run type checks
        run: |
          make typecheck

      - name: Packaging sanity check
        run: |
          .venv/bin/python -m build --sdist --wheel --outdir dist/ .
          .venv/bin/python -c "import zipfile, glob; whl = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(whl).namelist(); assert any('terraflow' in n for n in names), 'wheel missing terraflow package'"

      - name: Smoke run (synthetic data)
        run: make smoke-test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
