name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Ensure make is available
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Set up virtualenv and install dev deps
        run: |
          make venv
          make dev

      - name: Run tests with coverage
        run: |
          make test-cov

      - name: Run linting
        run: |
          make lint

      - name: Run type checks
        run: |
          make typecheck

      - name: Packaging sanity check
        run: |
          .venv/bin/python -m build --sdist --wheel --outdir dist/ .
          .venv/bin/python -c "import zipfile, glob; whl = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(whl).namelist(); assert any('terraflow' in n for n in names), 'wheel missing terraflow package'"

      - name: Smoke run (synthetic data)
        run: make smoke-test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t terraflow:ci .

      - name: Prepare output directory
        run: |
          mkdir -p docker-out
          # Container runs as uid 1001 (terraflow user); match host ownership
          sudo chown -R 1001:1001 docker-out

      - name: Run demo pipeline end-to-end
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/docker-out:/app/outputs \
            terraflow:ci \
            run --config examples/demo_config.yml

      - name: Verify pipeline outputs exist
        run: |
          run_dir=$(ls -d docker-out/demo_run/runs/*)
          echo "Run dir: $run_dir"
          test -f "$run_dir/features.parquet"
          test -f "$run_dir/manifest.json"
          test -f "$run_dir/report.json"

  docker-smoke-offline:
    # JOSS-04 (#67): reviewers must be able to reproduce results in an
    # air-gapped environment.  Runs the demo pipeline with --network none
    # to prove nothing fetches external data at runtime.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run offline docker smoke
        run: make docker-smoke
