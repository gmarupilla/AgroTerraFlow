name: Docs Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: Documentation Preview
      url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: make venv

      - name: Build docs
        run: make docs-build

      - name: Upload docs artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-${{ github.run_id }}
          path: site/
          retention-days: 1

      - name: Write job summary
        run: |
          echo "### 📚 Docs Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact:** [docs-preview-${{ github.run_id }}](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from commit \`${{ github.event.pull_request.head.sha }}\`. Expires in 1 day — re-run this job to refresh." >> "$GITHUB_STEP_SUMMARY"
