name: GeoAI integration

on:
  push:
    branches: ["main"]
    paths:
      - "terraflow/geoai_engine.py"
      - "tests/test_geoai_engine.py"
      - "terraflow/core/run_identity.py"
      - ".github/workflows/geoai-integration.yml"
      - "pyproject.toml"
  pull_request:
    branches: ["main"]
    paths:
      - "terraflow/geoai_engine.py"
      - "tests/test_geoai_engine.py"
      - "terraflow/core/run_identity.py"
      - ".github/workflows/geoai-integration.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  geoai-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Create venv and install with [geoai,dev] extras
        run: |
          uv venv .venv
          uv pip install -e ".[geoai,dev]"

      - name: Run GeoAI engine + fingerprint tests
        run: |
          .venv/bin/python -m pytest \
            tests/test_geoai_engine.py \
            tests/test_run_identity.py \
            -v --no-cov

      - name: Quick smoke import (geoai-py + torch)
        run: |
          .venv/bin/python -c "import geoai, torch; print('geoai', geoai.__version__); print('torch', torch.__version__)"
