name: Docs Preview Cleanup

on:
  pull_request:
    types: [closed]
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete pr-${{ github.event.number }}/ from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          PREVIEW_DIR="/tmp/gh-pages/pr-${{ github.event.number }}"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "No preview directory to clean up."
            exit 0
          fi

          rm -rf "$PREVIEW_DIR"
          cd /tmp/gh-pages
          git add -A
          git commit -m "docs(preview): remove pr-${{ github.event.number }} (PR closed)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
