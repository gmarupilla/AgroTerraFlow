[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-impact-benchmark"
version = "0.1.0"
description = "An impact-labeled, prediction-ready drought benchmark (insured drought loss as target)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Gnaneswara (Akhil) Marupilla" }
]

keywords = ["drought", "benchmark", "agriculture", "crop-insurance", "machine-learning", "dataset"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# NOTE: no dependency on terraflow — this package is spin-out ready. The
# deterministic-build primitives are vendored (see src/drought_impact/fingerprint.py).
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pyarrow>=14.0",
  "pydantic>=2.0",
  "pyyaml>=5.4.0",
  "scikit-learn>=1.0",
  "scipy>=1.9.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff",
  "black",
]

[project.scripts]
drought-impact = "drought_impact.cli:main"

[tool.setuptools]
packages = ["drought_impact"]
package-dir = { "" = "src" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
